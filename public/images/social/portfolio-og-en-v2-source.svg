<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Lucas Epherra — Full Stack Developer</title>
  <desc id="description">Lucas Epherra's portfolio preview using the current homepage design.</desc>

  <defs>
    <clipPath id="portrait-clip">
      <rect x="790" y="100" width="410" height="530" />
    </clipPath>
    <linearGradient id="portrait-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2321" stop-opacity="0.24" />
      <stop offset="0.32" stop-color="#1f2321" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="surface-light" cx="46%" cy="46%" r="48%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#1f2321" />
  <rect width="790" height="630" fill="url(#surface-light)" />

  <rect width="1200" height="100" fill="#1f2321" />
  <line x1="0" y1="99" x2="1200" y2="99" stroke="#faf9f5" stroke-opacity="0.15" />
  <text x="55" y="61" fill="#faf9f5" font-family="Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4.5">LUCAS EPHERRA</text>
  <text x="1118" y="61" fill="#d87858" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" text-anchor="end">EN</text>

  <line x1="110" y1="100" x2="110" y2="630" stroke="#faf9f5" stroke-opacity="0.15" />
  <text x="55" y="151" fill="#d87858" font-family="Georgia, serif" font-size="24" text-anchor="middle">LE</text>
  <text x="55" y="570" fill="#faf9f5" fill-opacity="0.52" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">ARG</text>
  <text x="55" y="592" fill="#faf9f5" fill-opacity="0.52" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">UTC-3</text>

  <text x="160" y="170" fill="#d87858" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3.2">FULL STACK DEVELOPER</text>
  <text x="155" y="260" fill="#faf9f5" font-family="Georgia, serif" font-size="57" letter-spacing="-1.5">I design, build and</text>
  <text x="155" y="327" fill="#faf9f5" font-family="Georgia, serif" font-size="57" letter-spacing="-1.5">ship complete</text>
  <text x="155" y="394" fill="#faf9f5" font-family="Georgia, serif" font-size="57" letter-spacing="-1.5">web products.</text>

  <line x1="160" y1="446" x2="272" y2="446" stroke="#d87858" stroke-width="3" />
  <text x="160" y="492" fill="#faf9f5" fill-opacity="0.68" font-family="Arial, sans-serif" font-size="18">Frontend · Backend · Data · Production</text>
  <text x="160" y="557" fill="#faf9f5" fill-opacity="0.5" font-family="Arial, sans-serif" font-size="15" letter-spacing="0.8">www.lucasepherra.com.ar</text>

  <image href="../lucas-epherra.webp" x="790" y="100" width="410" height="530" preserveAspectRatio="xMidYMin slice" clip-path="url(#portrait-clip)" />
  <rect x="790" y="100" width="410" height="530" fill="url(#portrait-shade)" />
  <line x1="790" y1="100" x2="790" y2="630" stroke="#faf9f5" stroke-opacity="0.15" />
